name: Full application visual audit

on:
  push:
    branches: [feature/real-data-manifest-export-pipeline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-app-visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install visual QA browser
        run: |
          bun add --dev --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium
      - name: Build production application
        run: bun run build
      - name: Start deterministic QA upstream
        run: |
          nohup bun scripts/qa/mock-full-app-upstream.ts > mock-upstream.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4174/api/health && break
            sleep 1
          done
      - name: Start production server
        env:
          PORT: "4173"
          NITRO_PORT: "4173"
          HOST: 0.0.0.0
          BOXCRAFT_UPSTREAM_URL: http://127.0.0.1:4174
          GPTSBOXES_ADMIN_ACCESS_KEY: visual-admin-key
          GPTSBOXES_ADMIN_SESSION_SECRET: visual-audit-session-secret-at-least-32-characters
          GPTSBOXES_ADMIN_UPSTREAM_URL: http://127.0.0.1:4174
          GPTSBOXES_ADMIN_UPSTREAM_TOKEN: visual-admin-upstream-token
        run: |
          nohup node .output/server/index.mjs > application.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ && break
            sleep 1
          done
      - name: Capture all application states
        env:
          VISUAL_AUDIT_OUTPUT: artifacts/full-app-visual-audit
        run: bun scripts/qa/full-app-visual-audit.ts
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-app-visual-audit
          path: |
            artifacts/full-app-visual-audit
            application.log
            mock-upstream.log
          if-no-files-found: warn
          retention-days: 7
