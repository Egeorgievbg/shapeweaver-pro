name: Application validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Check formatting
        run: |
          bunx prettier --check \
            src/components/admin/AdminAuthGate.tsx \
            src/components/admin/AdminControlCenter.tsx \
            src/components/catalog/CatalogView.tsx \
            src/components/dieline/DielineEditor.tsx \
            src/components/i18n/RuntimeLocalizationBridge.tsx \
            src/components/shell/AppHeader.tsx \
            src/components/studio/StudioWorkspace.tsx \
            src/integrations/admin/client.ts \
            src/integrations/boxcraft/client.ts \
            src/integrations/boxcraft/errors.ts \
            src/lib/env.ts \
            src/lib/i18n.ts \
            src/routes/__root.tsx \
            src/routes/admin.data.tsx \
            src/routes/configurations.tsx \
            src/routes/index.tsx \
            src/routes/library.tsx \
            'src/routes/studio.$productId.tsx' \
            src/server.ts \
            src/stores/persistence.ts \
            src/studio.css \
            vite.config.ts \
            .github/workflows/ui-ux-ci.yml
      - name: Lint changed application scope
        run: |
          bunx eslint \
            src/components/admin/AdminAuthGate.tsx \
            src/components/admin/AdminControlCenter.tsx \
            src/components/catalog/CatalogView.tsx \
            src/components/dieline/DielineEditor.tsx \
            src/components/i18n/RuntimeLocalizationBridge.tsx \
            src/components/shell/AppHeader.tsx \
            src/components/studio/StudioWorkspace.tsx \
            src/integrations/admin/client.ts \
            src/integrations/boxcraft/client.ts \
            src/integrations/boxcraft/errors.ts \
            src/lib/env.ts \
            src/lib/i18n.ts \
            src/routes/__root.tsx \
            src/routes/admin.data.tsx \
            src/routes/configurations.tsx \
            src/routes/index.tsx \
            src/routes/library.tsx \
            'src/routes/studio.$productId.tsx' \
            src/server.ts \
            src/stores/persistence.ts \
            vite.config.ts
