name: UI UX validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-ux-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: List formatting differences
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bunx prettier --list-different \
            src/components/catalog/CatalogView.tsx \
            src/components/dieline/DielineEditor.tsx \
            src/components/shell/AppHeader.tsx \
            src/components/studio/StudioWorkspace.tsx \
            src/integrations/boxcraft/client.ts \
            src/integrations/boxcraft/errors.ts \
            src/routes/__root.tsx \
            src/routes/library.tsx \
            'src/routes/studio.$productId.tsx' \
            src/studio.css \
            vite.config.ts \
            .github/workflows/ui-ux-ci.yml | tee prettier-different.txt
      - name: Upload formatting report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-format-report
          path: prettier-different.txt
          if-no-files-found: warn
          retention-days: 2
      - name: Enforce formatting
        if: steps.format.outcome == 'failure'
        run: exit 1
      - name: Lint changed UI scope
        run: |
          bunx eslint \
            src/components/catalog/CatalogView.tsx \
            src/components/dieline/DielineEditor.tsx \
            src/components/shell/AppHeader.tsx \
            src/components/studio/StudioWorkspace.tsx \
            src/integrations/boxcraft/client.ts \
            src/integrations/boxcraft/errors.ts \
            src/routes/__root.tsx \
            src/routes/library.tsx \
            'src/routes/studio.$productId.tsx' \
            vite.config.ts
