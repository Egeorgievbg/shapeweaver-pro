name: Full application visual audit PR

on:
  pull_request:
    branches: [feature/bg-en-admin-control-center, main]

permissions:
  contents: read

concurrency:
  group: full-app-visual-audit-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Chromium QA runtime
        run: |
          bun add --dev --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium
      - run: bun run build
      - name: Start QA services
        env:
          PORT: "4173"
          NITRO_PORT: "4173"
          HOST: 0.0.0.0
          BOXCRAFT_UPSTREAM_URL: http://127.0.0.1:4174
          GPTSBOXES_ADMIN_ACCESS_KEY: visual-admin-key
          GPTSBOXES_ADMIN_SESSION_SECRET: visual-audit-session-secret-at-least-32-characters
          GPTSBOXES_ADMIN_UPSTREAM_URL: http://127.0.0.1:4174
          GPTSBOXES_ADMIN_UPSTREAM_TOKEN: visual-admin-upstream-token
        run: |
          nohup bun scripts/qa/mock-full-app-upstream.ts > mock-upstream.log 2>&1 &
          nohup node .output/server/index.mjs > application.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4174/api/health >/dev/null && \
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - name: Capture application
        env:
          VISUAL_AUDIT_OUTPUT: artifacts/full-app-visual-audit
        run: bun scripts/qa/full-app-visual-audit-v2.ts
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-app-visual-audit
          path: |
            artifacts/full-app-visual-audit
            application.log
            mock-upstream.log
          if-no-files-found: warn
          retention-days: 7
