name: Temporary demo formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bunx prettier --write scripts/demo/demo-database-server.ts scripts/demo/run-demo.ts scripts/demo/stable-demo-manifest.ts
          mkdir -p formatted/scripts/demo
          cp scripts/demo/demo-database-server.ts formatted/scripts/demo/
          cp scripts/demo/run-demo.ts formatted/scripts/demo/
          cp scripts/demo/stable-demo-manifest.ts formatted/scripts/demo/
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-demo-files
          path: formatted
          if-no-files-found: error
          retention-days: 1
