name: BG EN admin visual smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install Playwright Chromium
        run: |
          bun add --no-save playwright
          bunx playwright install --with-deps chromium
      - name: Start mock upstream and production server
        shell: bash
        run: |
          bun scripts/qa/mock-admin-upstream.ts > mock-upstream.log 2>&1 &
          BOXCRAFT_UPSTREAM_URL=http://127.0.0.1:4174 \
          GPTSBOXES_ADMIN_ACCESS_KEY=visual-admin-key \
          GPTSBOXES_ADMIN_SESSION_SECRET=visual-session-secret-with-more-than-32-characters \
          GPTSBOXES_ADMIN_UPSTREAM_URL=http://127.0.0.1:4174 \
          GPTSBOXES_ADMIN_UPSTREAM_TOKEN=visual-upstream-token \
          PORT=4173 HOST=0.0.0.0 NITRO_PORT=4173 NITRO_HOST=0.0.0.0 \
            bun .output/server/index.mjs > admin-visual-server.log 2>&1 &

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4174/api/health > /dev/null && \
               curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat mock-upstream.log
          cat admin-visual-server.log
          exit 1
      - name: Validate Bulgarian English and authenticated admin layouts
        run: bun scripts/qa/admin-visual-smoke.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bg-en-admin-visual-smoke
          path: |
            landing-bg-desktop.png
            landing-bg-desktop.txt
            landing-en-desktop.png
            landing-en-desktop.txt
            admin-login-en-desktop.png
            admin-login-en-desktop.txt
            admin-en-desktop.png
            admin-en-desktop.txt
            admin-bg-before-assertions.png
            admin-bg-before-assertions.txt
            admin-bg-desktop.png
            admin-bg-desktop.txt
            admin-login-bg-mobile.png
            admin-login-bg-mobile.txt
            admin-bg-mobile.png
            admin-bg-mobile.txt
            visual-result.txt
            visual-error.txt
            visual-failure.png
            visual-failure-body.txt
            admin-visual-server.log
            mock-upstream.log
          if-no-files-found: warn
          retention-days: 3
