name: SQLite demo preview

on:
  push:
    branches: [fix/sqlite-demo-preview]
  pull_request:
    branches: [feature/real-data-manifest-export-pipeline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install browser runtime
        run: |
          bun add --dev --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium
      - name: Build validated SQLite demo database
        run: |
          mkdir -p data/demo
          bun <<'TS'
          import { Database } from "bun:sqlite";
          import { DEMO_PRODUCTS } from "./scripts/demo/demo-products.ts";
          import { makeDemoManifest } from "./scripts/demo/demo-manifest.ts";
          const db = new Database("data/demo/gptsboxes_demo.sqlite", { create: true, strict: true });
          db.exec("PRAGMA foreign_keys=ON");
          db.exec("CREATE TABLE products(source_id TEXT PRIMARY KEY,name TEXT NOT NULL,family TEXT NOT NULL,category TEXT NOT NULL,material TEXT NOT NULL,color TEXT NOT NULL,length_mm REAL NOT NULL,width_mm REAL NOT NULL,height_mm REAL NOT NULL,product_line TEXT NOT NULL,geometry_quality TEXT NOT NULL,production_status TEXT NOT NULL)");
          db.exec("CREATE TABLE manifests(source_id TEXT PRIMARY KEY REFERENCES products(source_id),source_hash TEXT NOT NULL,manifest_json TEXT NOT NULL)");
          const product = db.prepare("INSERT INTO products VALUES ($sourceId,$name,$family,$category,$material,$color,$length,$width,$height,$productLine,'qa-fixture','unverified')");
          const manifest = db.prepare("INSERT INTO manifests VALUES ($sourceId,$sourceHash,$manifestJson)");
          for (const item of DEMO_PRODUCTS) {
            product.run(item);
            const value = makeDemoManifest(item);
            manifest.run({ sourceId: item.sourceId, sourceHash: value.sourceHash, manifestJson: JSON.stringify(value) });
          }
          const integrity = db.query("PRAGMA integrity_check").get();
          const foreignKeys = db.query("PRAGMA foreign_key_check").all();
          const count = db.query("SELECT COUNT(*) AS count FROM products").get();
          console.log({ integrity, foreignKeyErrors: foreignKeys.length, count });
          if (foreignKeys.length > 0 || !Object.values(integrity).includes("ok")) process.exit(1);
          db.close();
          TS
      - name: Production build
        run: bun run build
      - name: Start database API and application
        env:
          PORT: "4173"
          NITRO_PORT: "4173"
          HOST: 0.0.0.0
          BOXCRAFT_UPSTREAM_URL: http://127.0.0.1:4174
          GPTSBOXES_ADMIN_ACCESS_KEY: demo-admin-key
          GPTSBOXES_ADMIN_SESSION_SECRET: demo-session-secret-at-least-32-characters
          GPTSBOXES_ADMIN_UPSTREAM_URL: http://127.0.0.1:4174
          GPTSBOXES_ADMIN_UPSTREAM_TOKEN: demo-upstream-token
        run: |
          nohup bun scripts/demo/demo-database-server.ts > demo-database.log 2>&1 &
          nohup node .output/server/index.mjs > application.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4174/api/health >/dev/null && curl --fail --silent http://127.0.0.1:4173/library >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4174/api/health
          curl --fail http://127.0.0.1:4174/api/v1/visualization/products
      - name: Capture working project
        env:
          DEMO_PREVIEW_OUTPUT: artifacts/sqlite-demo-preview
        run: bun scripts/demo/capture-demo-preview.ts
      - name: Upload runnable preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-demo-preview
          path: |
            artifacts/sqlite-demo-preview
            data/demo/gptsboxes_demo.sqlite
            demo-database.log
            application.log
          if-no-files-found: error
          retention-days: 14
