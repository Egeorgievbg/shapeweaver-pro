name: UI UX visual smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start production server
        shell: bash
        run: |
          find .output -maxdepth 3 -type f | sort > output-files.txt
          PORT=4173 HOST=0.0.0.0 NITRO_PORT=4173 NITRO_HOST=0.0.0.0 \
            bun .output/server/index.mjs > shapeweaver-preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4173/library > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat shapeweaver-preview.log
          exit 1
      - name: Inspect production assets
        shell: bash
        run: |
          curl --silent --show-error --dump-header library-headers.txt \
            http://127.0.0.1:4173/library > library.html
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import urlopen, Request

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.styles = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "link" and attrs.get("rel") == "stylesheet" and attrs.get("href"):
                      self.styles.append(attrs["href"])

          body = Path("library.html").read_text(errors="replace")
          parser = Links()
          parser.feed(body)
          lines = [f"stylesheets={len(parser.styles)}"]
          for href in parser.styles:
              url = urljoin("http://127.0.0.1:4173/library", href)
              try:
                  response = urlopen(Request(url, headers={"User-Agent": "shapeweaver-smoke"}), timeout=10)
                  payload = response.read()
                  lines.append(
                      f"{url} status={response.status} content_type={response.headers.get('content-type')} bytes={len(payload)}"
                  )
              except Exception as exc:
                  lines.append(f"{url} ERROR {exc}")
          Path("asset-report.txt").write_text("\n".join(lines) + "\n")
          print(Path("asset-report.txt").read_text())
          PY
      - name: Capture desktop and mobile library
        run: |
          bunx playwright screenshot \
            --device="Desktop Chrome" \
            --wait-for-timeout=8000 \
            --full-page \
            http://127.0.0.1:4173/library \
            ui-ux-library-desktop.png
          bunx playwright screenshot \
            --device="Pixel 7" \
            --wait-for-timeout=8000 \
            --full-page \
            http://127.0.0.1:4173/library \
            ui-ux-library-mobile.png
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-visual-smoke
          path: |
            ui-ux-library-desktop.png
            ui-ux-library-mobile.png
            shapeweaver-preview.log
            library.html
            library-headers.txt
            asset-report.txt
            output-files.txt
          if-no-files-found: warn
          retention-days: 3
